<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Placement</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="text-danger">Delete Placement</h2>

            <p class="mt-3">
                Are you sure you want to delete this placement application?
            </p>

            <p>
                <strong>Student:</strong> {{ placement.student.name }}
            </p>

            <p>
                <strong>Company:</strong> {{ placement.company.name }}
            </p>

            <p>
                <strong>Job Role:</strong> {{ placement.job_role }}
            </p>

            <form method="POST">

                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Yes, Delete
                </button>

                <a href="{% url 'placement_list' %}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
